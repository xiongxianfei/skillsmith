version: 1
scenarios:
  - id: vocabulary-record-two-complete-references
    category: normal
    prompt: |
      /vocabulary-mastery record
      Give me the full English and Chinese linguistic reference.
    expected_behavior: >
      Produces two separate, self-contained references in the required order:
      Part 1 entirely English, then Part 2 in natural Simplified Chinese.
      Each part has its own word overview, the same ten numbered linguistic
      dimensions in the same order, knowledge connections, three recall
      questions, and three answers. Chinese headings are actually localized.
      Chinese explanations are full, not summaries or cross-references.
      The reference distinguishes noun and verb record stress and senses,
      with aligned accent-labelled IPA and example content in both parts.

  - id: vocabulary-bank-context-sense-parity
    category: normal
    prompt: |
      Study "bank" in "We had lunch on the bank of the river."
    expected_behavior: >
      Prioritizes riverbank over the financial institution in both complete
      standalone versions. The Chinese reference explains the same sense
      distinctions, contexts, sound information and usage evidence and
      includes Chinese translations of the same original English examples,
      rather than switching back to the financial sense.

  - id: vocabulary-morphology-unhappiness
    category: normal
    prompt: |
      /vocabulary-mastery unhappiness
    expected_behavior: >
      Both full ten-domain versions accurately explain the real morphology
      un-, happy and -ness and the related spelling change, rather than
      inventing etymology. The Chinese version supplies its own overview,
      complete morphology explanation, remaining nine domains, connections,
      three Chinese recall questions, and three Chinese answers.

  - id: vocabulary-indirect-deep-word-breakdown
    category: indirect-trigger
    prompt: |
      Can you really take apart the word "resilient"—how it sounds, how it's
      built, what it means, and how it works in conversation and in a paragraph?
      Explain it in English and Chinese.
    expected_behavior: >
      Recognizes deep word analysis as the intended skill and produces
      Part 1 English then Part 2 Simplified Chinese, each a full ten-domain
      reference. Does not interleave explanations, replace Chinese with a
      compact translation list, or generate an unrelated flashcard deck.

  - id: vocabulary-homograph-lead
    category: edge
    prompt: |
      /vocabulary-mastery lead
    expected_behavior: >
      Both independently readable reference parts distinguish /liːd/
      for a guide-related sense from /led/ for the metal, with relevant
      word classes and accent labels. Chinese sense glosses do not collapse
      these into a single pronunciation or meaning.

  - id: vocabulary-apple-weak-dimensions
    category: edge
    prompt: |
      /vocabulary-mastery apple
    expected_behavior: >
      Each version includes all ten domains while honestly noting that
      apple has no special word-specific speech act or unique phrasal
      intonation. Both explain ordinary sentence-level focus examples
      without inventing a word-specific phenomenon, and the Chinese
      example retains English wording plus a Chinese translation.

  - id: vocabulary-separable-expression
    category: edge
    prompt: |
      /vocabulary-mastery look up
      I mean search for a word in a dictionary.
    expected_behavior: >
      Treats look up as a lexical expression with the requested sense,
      explaining in both full versions that 'look it up' is well-formed
      whereas 'look up it' is not the correct particle placement for this
      sense. Chinese content gives real syntactic explanation with the same
      examples rather than simply saying to see the English section.

  - id: vocabulary-coinage-evidence-boundary
    category: edge
    prompt: |
      /vocabulary-mastery flinderation
      I invented this word.
    expected_behavior: >
      Distinguishes the user-created coinage from an attested standard
      headword. Both standalone versions note missing evidence for
      established IPA, meaning, frequency, etymology and collocations,
      without inventing facts just to fill all ten required sections.

  - id: vocabulary-parallel-recall-questions
    category: normal
    prompt: |
      /vocabulary-mastery record
      Include questions to test me at the end.
    expected_behavior: >
      Places exactly three recall questions and their three answers
      in Part 1 and equivalent Chinese questions with aligned answers
      in Part 2, within each complete reference. The Chinese version
      does not substitute 'same questions as above' or translate only
      the questions without the answer key.

  - id: vocabulary-chinese-explanations-not-abridged
    category: edge
    prompt: |
      /vocabulary-mastery record
      I want to read the Chinese version independently.
    expected_behavior: >
      Preserves one complete English reference followed by one complete
      Chinese reference with all ten numbered sections, full Chinese
      explanations, and original English examples alongside accurate
      Chinese translations. The Chinese half is not a list of glosses
      or a condensed set of highlights. Explanatory paragraphs are not
      alternated EN/ZH within each domain.

  - id: vocabulary-text-no-learner-audio
    category: edge
    prompt: |
      /vocabulary-mastery record
      Can you tell from this typed word whether my stress is wrong?
    expected_behavior: >
      Both full versions distinguish reference word stress from actual
      learner production and explain that text alone cannot reveal
      how the user pronounced it. Does not claim to have heard audio
      or to have determined that the learner pronounced it incorrectly.

  - id: vocabulary-no-input
    category: failure
    prompt: |
      /vocabulary-mastery
    expected_behavior: >
      Asks for one English headword or lexical expression rather than
      creating empty ten-section references in either language.

  - id: vocabulary-multiple-unrelated-targets
    category: edge
    prompt: |
      /vocabulary-mastery apple, bank, record, resilient
    expected_behavior: >
      Requests one target word rather than creating shortened
      multiword entries with incomplete bilingual coverage.

  - id: vocabulary-not-editor
    category: non-trigger
    prompt: |
      Please correct my email and keep the meaning:
      We maybe will push the rollout after the tests.
    expected_behavior: >
      Does not auto-route ordinary proofreading to vocabulary-mastery or
      produce two ten-domain word profiles; leaves writing correction
      to the editor skill.

  - id: vocabulary-not-flashcards
    category: non-trigger
    prompt: |
      Make 20 Anki cards about the words stable, resilient and robust. Export TSV.
    expected_behavior: >
      Does not replace flashcard-generator or the requested card format
      with several long reference entries.

  - id: vocabulary-conventional-fixed-two-part-contract
    category: edge
    prompt: |
      /vocabulary-mastery record
      Please make the explanations bilingual line by line.
    expected_behavior: >
      Follows the selected skill contract: a complete English reference
      followed by a complete Simplified Chinese reference, not an
      interleaved line-by-line bilingual output. The user can review
      each version independently, with parallel sense maps, examples,
      questions, and answers.

  - id: vocabulary-shared-sense-and-examples-between-versions
    category: edge
    prompt: |
      /vocabulary-mastery record
      Context: We recorded the interview. The recording is stored in our archive.
      Please explain the distinction deeply in both output versions.
    expected_behavior: >
      Resolves the intended verb and noun meanings once, then uses those same
      senses and parts of speech in the complete English and Chinese references.
      Preserves the identical original English illustrative sentences across
      both versions, with faithful Chinese translations. Uses consistent
      IPA/variety claims and does not let one version independently switch
      to the achievement sense or invent alternative examples.

  - id: vocabulary-honest-limitation-across-both-versions
    category: edge
    prompt: |
      /vocabulary-mastery apple
      I want all ten linguistic dimensions but do not have audio.
    expected_behavior: >
      Both independent versions cover all ten dimensions and describe an
      ordinary word honestly; neither invents the learner's pronunciation,
      unique intonation, cultural speech act, or unsupported etymology.
      The Chinese version includes the same evidence limits as the English
      one rather than making stronger claims to fill its sections.
